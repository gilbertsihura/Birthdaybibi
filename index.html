<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Happy Birthday!</title>
  
  <!-- Canvas Confetti Library -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@400;600&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
      font-family: 'Poppins', sans-serif;
      overflow-x: hidden;
      padding: 20px;
    }

    #confetti-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 99;
    }

    .card {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      padding: 40px 30px;
      max-width: 450px;
      width: 100%;
      text-align: center;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
      animation: float 3s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    .title {
      font-family: 'Dancing Script', cursive;
      font-size: 3rem;
      color: #ff4757;
      margin-bottom: 10px;
    }

    .cake-container {
      font-size: 4rem;
      margin: 20px 0;
      cursor: pointer;
      user-select: none;
      transition: transform 0.2s;
    }

    .cake-container:hover {
      transform: scale(1.1);
    }

    .message {
      font-size: 1rem;
      color: #57606f;
      line-height: 1.6;
      margin-bottom: 25px;
    }

    .btn {
      background: linear-gradient(45deg, #ff4757, #ff6b81);
      color: #fff;
      border: none;
      padding: 12px 28px;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 5px 15px rgba(255, 71, 87, 0.4);
      transition: all 0.3s ease;
      outline: none;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(255, 71, 87, 0.6);
    }

    .btn:active {
      transform: translateY(1px);
    }

    @media (max-width: 480px) {
      .card {
        padding: 30px 20px;
      }
      .title {
        font-size: 2.3rem;
      }
      .message {
        font-size: 0.95rem;
      }
    }
  </style>
</head>
<body>

  <canvas id="confetti-canvas"></canvas>

  <div class="card">
    <h1 class="title">Happy Birthday Mi Bibi!</h1>
    
    <div class="cake-container" onclick="triggerCelebration()">
      🎂
    </div>

    <p class="message">
      Makasih ya sayangku sudah terus berjuang dan tumbuh jadi pribadi yang luar biasa. Semoga semua lelahmu berganti jadi hasil yang manis tahun ini. I’m so proud of you, always🤍✨
    </p>

    <button class="btn" onclick="triggerCelebration()">Make a Wish ✨</button>
  </div>

  <script>
    window.addEventListener('DOMContentLoaded', () => {
      fireConfetti();
    });

    // Web Audio API Synthesizer untuk Melodi Happy Birthday
    function playHappyBirthdayMusic() {
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      if (!AudioContext) return;
      const ctx = new AudioContext();

      const notes = [
        { freq: 392.00, duration: 0.25 }, { freq: 392.00, duration: 0.25 },
        { freq: 440.00, duration: 0.5 },  { freq: 392.00, duration: 0.5 },
        { freq: 523.25, duration: 0.5 },  { freq: 493.88, duration: 1.0 },
        
        { freq: 392.00, duration: 0.25 }, { freq: 392.00, duration: 0.25 },
        { freq: 440.00, duration: 0.5 },  { freq: 392.00, duration: 0.5 },
        { freq: 587.33, duration: 0.5 },  { freq: 523.25, duration: 1.0 },

        { freq: 392.00, duration: 0.25 }, { freq: 392.00, duration: 0.25 },
        { freq: 783.99, duration: 0.5 },  { freq: 659.25, duration: 0.5 },
        { freq: 523.25, duration: 0.5 },  { freq: 493.88, duration: 0.5 },
        { freq: 440.00, duration: 1.0 },

        { freq: 698.46, duration: 0.25 }, { freq: 698.46, duration: 0.25 },
        { freq: 659.25, duration: 0.5 },  { freq: 523.25, duration: 0.5 },
        { freq: 587.33, duration: 0.5 },  { freq: 523.25, duration: 1.0 }
      ];

      let time = ctx.currentTime;
      notes.forEach(item => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();

        osc.type = 'sine'; 
        osc.frequency.setValueAtTime(item.freq, time);

        gain.gain.setValueAtTime(0.08, time);
        gain.gain.exponentialRampToValueAtTime(0.0001, time + item.duration - 0.03);

        osc.connect(gain);
        gain.connect(ctx.destination);

        osc.start(time);
        osc.stop(time + item.duration);

        time += item.duration * 1.05;
      });
    }

    function triggerCelebration() {
      playHappyBirthdayMusic();

      var count = 200;
      var defaults = {
        origin: { y: 0.7 }
      };

      function fire(particleRatio, opts) {
        confetti(Object.assign({}, defaults, opts, {
          particleCount: Math.floor(count * particleRatio)
        }));
      }

      fire(0.25, { spread: 26, startVelocity: 55 });
      fire(0.2, { spread: 60 });
      fire(0.35, { spread: 100, decay: 0.91, scalar: 0.8 });
      fire(0.1, { spread: 120, startVelocity: 25, decay: 0.92, scalar: 1.2 });
      fire(0.1, { spread: 120, startVelocity: 45 });
    }

    function fireConfetti() {
      confetti({
        particleCount: 100,
        spread: 70,
        origin: { y: 0.6 }
      });
    }
  </script>
</body>
</html>
